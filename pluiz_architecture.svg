<svg viewBox="0 0 730 980" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Segoe UI', system-ui, sans-serif">
  <title>Pluiz v2 시스템 아키텍처 및 실행 흐름</title>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#6b7280"/>
    </marker>
    <marker id="arr-b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#fbbf24"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4ade80"/>
    </marker>
    <marker id="arr-r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#ff7043"/>
    </marker>
  </defs>

  <!-- BG -->
  <rect width="730" height="980" fill="#0e0e16" rx="16"/>

  <!-- TITLE -->
  <text x="365" y="36" text-anchor="middle" fill="#e8e8f0" font-size="15" font-weight="700">Pluiz v2 — 시스템 구조 &amp; 실행 흐름</text>

  <!-- ════════════════════════════════════════════
       LAYER 1: UI (Electron)
  ════════════════════════════════════════════ -->
  <rect x="30" y="56" width="660" height="116" rx="10" fill="#1c1c2c" stroke="#7c6fef" stroke-width="1.5"/>
  <text x="46" y="76" fill="#7c6fef" font-size="11" font-weight="700">① ELECTRON UI  (electron-ui/index.html + main.js)</text>

  <rect x="46" y="86" width="190" height="72" rx="8" fill="#12122a" stroke="#6d5ee0" stroke-width="1"/>
  <text x="141" y="103" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="600">음성 입력</text>
  <text x="141" y="118" text-anchor="middle" fill="#8888aa" font-size="9">🎙️ MediaRecorder</text>
  <text x="141" y="131" text-anchor="middle" fill="#8888aa" font-size="9">webm blob → POST /voice</text>
  <text x="141" y="144" text-anchor="middle" fill="#8888aa" font-size="9">응답 audio_base64 → 재생</text>

  <rect x="264" y="86" width="190" height="72" rx="8" fill="#12122a" stroke="#6d5ee0" stroke-width="1"/>
  <text x="359" y="103" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="600">텍스트 입력</text>
  <text x="359" y="118" text-anchor="middle" fill="#8888aa" font-size="9">⌨️ textarea → WebSocket /ws</text>
  <text x="359" y="131" text-anchor="middle" fill="#8888aa" font-size="9">chunk 수신 → 실시간 출력</text>
  <text x="359" y="144" text-anchor="middle" fill="#8888aa" font-size="9">end 시 audio_base64 → 재생</text>

  <rect x="482" y="86" width="190" height="72" rx="8" fill="#12122a" stroke="#6d5ee0" stroke-width="1"/>
  <text x="577" y="103" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="600">공통 TTS 재생</text>
  <text x="577" y="118" text-anchor="middle" fill="#8888aa" font-size="9">playAudio(base64)</text>
  <text x="577" y="131" text-anchor="middle" fill="#8888aa" font-size="9">Blob URL → Audio 객체</text>
  <text x="577" y="144" text-anchor="middle" fill="#8888aa" font-size="9">음성이든 텍스트든 동일</text>

  <!-- arrow down -->
  <line x1="360" y1="172" x2="360" y2="204" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="370" y="192" fill="#6b7280" font-size="9">HTTP / WebSocket</text>

  <!-- ════════════════════════════════════════════
       LAYER 2: FastAPI Server
  ════════════════════════════════════════════ -->
  <rect x="30" y="204" width="660" height="96" rx="10" fill="#1c1c2c" stroke="#4ade80" stroke-width="1.5"/>
  <text x="46" y="224" fill="#4ade80" font-size="11" font-weight="700">② FastAPI 서버  (main.py) — 포트 8765</text>

  <rect x="46" y="232" width="190" height="54" rx="8" fill="#0a1a10" stroke="#22c55e" stroke-width="1"/>
  <text x="141" y="250" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="600">POST /voice</text>
  <text x="141" y="264" text-anchor="middle" fill="#8888aa" font-size="9">STT → agent.run_async()</text>
  <text x="141" y="277" text-anchor="middle" fill="#8888aa" font-size="9">→ TTS → audio_base64 반환</text>

  <rect x="264" y="232" width="190" height="54" rx="8" fill="#0a1a10" stroke="#22c55e" stroke-width="1"/>
  <text x="359" y="250" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="600">WebSocket /ws</text>
  <text x="359" y="264" text-anchor="middle" fill="#8888aa" font-size="9">agent.stream() → chunk 전송</text>
  <text x="359" y="277" text-anchor="middle" fill="#8888aa" font-size="9">end 시 TTS 포함 (use_tts=True)</text>

  <rect x="482" y="232" width="190" height="54" rx="8" fill="#0a1a10" stroke="#22c55e" stroke-width="1"/>
  <text x="577" y="250" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="600">GET|POST /api/config</text>
  <text x="577" y="264" text-anchor="middle" fill="#8888aa" font-size="9">provider + API Key 관리</text>
  <text x="577" y="277" text-anchor="middle" fill="#8888aa" font-size="9">.env 갱신 → 에이전트 재초기화</text>

  <!-- arrow down -->
  <line x1="360" y1="300" x2="360" y2="330" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="370" y="320" fill="#6b7280" font-size="9">agent.run_async() / stream()</text>

  <!-- ════════════════════════════════════════════
       LAYER 3: 3단계 실행 파이프라인 (NEW)
  ════════════════════════════════════════════ -->
  <rect x="30" y="332" width="660" height="100" rx="10" fill="#1c1c2c" stroke="#ff7043" stroke-width="1.5"/>
  <text x="46" y="352" fill="#ff7043" font-size="11" font-weight="700">③ 3단계 실행 파이프라인  (core/agent.py · security.py · command_cache.py)</text>

  <!-- Security box -->
  <rect x="46" y="362" width="180" height="56" rx="8" fill="#2a1a15" stroke="#ff7043" stroke-width="1.2"/>
  <text x="136" y="381" text-anchor="middle" fill="#ff7043" font-size="10" font-weight="600">🛡 Security</text>
  <text x="136" y="395" text-anchor="middle" fill="#8888aa" font-size="9">위험 명령 정규식 25개+</text>
  <text x="136" y="408" text-anchor="middle" fill="#8888aa" font-size="9">LLM 전 결정론적 차단</text>

  <!-- arrow -->
  <line x1="226" y1="390" x2="262" y2="390" stroke="#ff7043" stroke-width="1.2" marker-end="url(#arr-r)"/>
  <text x="244" y="384" text-anchor="middle" fill="#6b4030" font-size="8">통과</text>

  <!-- Cache box -->
  <rect x="264" y="362" width="180" height="56" rx="8" fill="#172517" stroke="#66bb6a" stroke-width="1.2"/>
  <text x="354" y="381" text-anchor="middle" fill="#66bb6a" font-size="10" font-weight="600">⚡ Command Cache</text>
  <text x="354" y="395" text-anchor="middle" fill="#8888aa" font-size="9">Intent + 퍼지 매칭 (0.80)</text>
  <text x="354" y="408" text-anchor="middle" fill="#8888aa" font-size="9">히트 시 LLM 없이 직접 실행</text>

  <!-- arrow -->
  <line x1="444" y1="390" x2="480" y2="390" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="462" y="384" text-anchor="middle" fill="#445" font-size="8">미스</text>

  <!-- LLM box -->
  <rect x="482" y="362" width="190" height="56" rx="8" fill="#152030" stroke="#4fc3f7" stroke-width="1.2"/>
  <text x="577" y="381" text-anchor="middle" fill="#4fc3f7" font-size="10" font-weight="600">🤖 LangGraph ReAct</text>
  <text x="577" y="395" text-anchor="middle" fill="#8888aa" font-size="9">Gemini 2.0 Flash 판단</text>
  <text x="577" y="408" text-anchor="middle" fill="#8888aa" font-size="9">도구 선택 → 실행 → 반복</text>

  <!-- arrow down -->
  <line x1="360" y1="432" x2="360" y2="462" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="370" y="450" fill="#6b7280" font-size="9">ReAct 루프 진입</text>

  <!-- ════════════════════════════════════════════
       LAYER 4: LangGraph ReAct Loop
  ════════════════════════════════════════════ -->
  <rect x="30" y="464" width="660" height="210" rx="10" fill="#1c1c2c" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="46" y="484" fill="#fbbf24" font-size="11" font-weight="700">④ LangGraph ReAct 루프  (core/agent.py)</text>

  <!-- Human -->
  <rect x="46" y="494" width="120" height="44" rx="8" fill="#1a1500" stroke="#fbbf24" stroke-width="1"/>
  <text x="106" y="512" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">Human</text>
  <text x="106" y="527" text-anchor="middle" fill="#8888aa" font-size="9">사용자 입력</text>

  <!-- LLM Think -->
  <rect x="214" y="494" width="140" height="44" rx="8" fill="#1a1500" stroke="#fbbf24" stroke-width="1"/>
  <text x="284" y="512" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">LLM 판단</text>
  <text x="284" y="527" text-anchor="middle" fill="#8888aa" font-size="9">Gemini 2.0 Flash</text>

  <!-- Tool Call -->
  <rect x="402" y="494" width="140" height="44" rx="8" fill="#1a1500" stroke="#fbbf24" stroke-width="1"/>
  <text x="472" y="512" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">도구 실행</text>
  <text x="472" y="527" text-anchor="middle" fill="#8888aa" font-size="9">tool_calls → 결과 반환</text>

  <!-- Tool Result -->
  <rect x="590" y="494" width="84" height="44" rx="8" fill="#1a1500" stroke="#fbbf24" stroke-width="1"/>
  <text x="632" y="512" text-anchor="middle" fill="#fbbf24" font-size="10" font-weight="600">결과 관찰</text>
  <text x="632" y="527" text-anchor="middle" fill="#8888aa" font-size="9">ToolMessage</text>

  <!-- Arrows in loop -->
  <line x1="166" y1="516" x2="210" y2="516" stroke="#fbbf24" stroke-width="1.2" marker-end="url(#arr-b)"/>
  <line x1="354" y1="516" x2="398" y2="516" stroke="#fbbf24" stroke-width="1.2" marker-end="url(#arr-b)"/>
  <line x1="542" y1="516" x2="586" y2="516" stroke="#fbbf24" stroke-width="1.2" marker-end="url(#arr-b)"/>

  <!-- Loop back -->
  <path d="M632,538 Q632,572 472,572 Q330,572 284,572 L284,542" stroke="#fbbf24" stroke-width="1.2" fill="none" stroke-dasharray="4,3" marker-end="url(#arr-b)"/>
  <text x="440" y="587" text-anchor="middle" fill="#fbbf24" font-size="9">더 호출할 도구가 있으면 반복 (max 10)</text>

  <!-- Final Answer -->
  <rect x="200" y="600" width="320" height="44" rx="8" fill="#1a1500" stroke="#4ade80" stroke-width="1.5"/>
  <text x="360" y="618" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="600">최종 AIMessage 반환</text>
  <text x="360" y="633" text-anchor="middle" fill="#8888aa" font-size="9">도구 호출 없이 텍스트만 → 루프 종료 → 응답</text>

  <!-- MemorySaver -->
  <rect x="46" y="598" width="136" height="52" rx="8" fill="#0d1a0d" stroke="#22c55e" stroke-width="1"/>
  <text x="114" y="616" text-anchor="middle" fill="#4ade80" font-size="10" font-weight="600">MemorySaver</text>
  <text x="114" y="629" text-anchor="middle" fill="#8888aa" font-size="9">thread_id별 대화 기록</text>
  <text x="114" y="641" text-anchor="middle" fill="#8888aa" font-size="9">멀티스텝 맥락 유지</text>

  <!-- arrow down -->
  <line x1="360" y1="674" x2="360" y2="704" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="370" y="692" fill="#6b7280" font-size="9">도구 호출</text>

  <!-- ════════════════════════════════════════════
       LAYER 5: Tools (27개)
  ════════════════════════════════════════════ -->
  <rect x="30" y="706" width="660" height="150" rx="10" fill="#1c1c2c" stroke="#f87171" stroke-width="1.5"/>
  <text x="46" y="726" fill="#f87171" font-size="11" font-weight="700">⑤ Windows 제어 도구  (tools/ — 27개)</text>

  <!-- Row 1 -->
  <rect x="46" y="734" width="196" height="52" rx="8" fill="#1a0a0a" stroke="#f87171" stroke-width="1"/>
  <text x="144" y="752" text-anchor="middle" fill="#f87171" font-size="10" font-weight="600">app_control.py (5)</text>
  <text x="144" y="766" text-anchor="middle" fill="#8888aa" font-size="9">실행·종료·최대화·최소화</text>
  <text x="144" y="779" text-anchor="middle" fill="#8888aa" font-size="9">레지스트리 탐색 · AttachThreadInput</text>

  <rect x="254" y="734" width="196" height="52" rx="8" fill="#1a0a0a" stroke="#f87171" stroke-width="1"/>
  <text x="352" y="752" text-anchor="middle" fill="#f87171" font-size="10" font-weight="600">system.py (10)</text>
  <text x="352" y="766" text-anchor="middle" fill="#8888aa" font-size="9">볼륨·밝기·스크린샷</text>
  <text x="352" y="779" text-anchor="middle" fill="#8888aa" font-size="9">배터리·현재시간·실행앱 목록</text>

  <rect x="462" y="734" width="210" height="52" rx="8" fill="#1a0a0a" stroke="#f87171" stroke-width="1"/>
  <text x="567" y="752" text-anchor="middle" fill="#f87171" font-size="10" font-weight="600">filesystem.py (5)</text>
  <text x="567" y="766" text-anchor="middle" fill="#8888aa" font-size="9">파일·폴더 생성·탐색</text>
  <text x="567" y="779" text-anchor="middle" fill="#8888aa" font-size="9">파일 열기·최근파일</text>

  <!-- Row 2 -->
  <rect x="46" y="794" width="196" height="52" rx="8" fill="#1a0a0a" stroke="#f87171" stroke-width="1"/>
  <text x="144" y="812" text-anchor="middle" fill="#f87171" font-size="10" font-weight="600">web.py (5)</text>
  <text x="144" y="826" text-anchor="middle" fill="#8888aa" font-size="9">URL열기·웹검색·유튜브</text>
  <text x="144" y="839" text-anchor="middle" fill="#8888aa" font-size="9">지도·정보 조회</text>

  <rect x="254" y="794" width="196" height="52" rx="8" fill="#1a0a0a" stroke="#f87171" stroke-width="1"/>
  <text x="352" y="812" text-anchor="middle" fill="#f87171" font-size="10" font-weight="600">input_control.py (2)</text>
  <text x="352" y="826" text-anchor="middle" fill="#8888aa" font-size="9">텍스트 입력 (한국어 클립보드)</text>
  <text x="352" y="839" text-anchor="middle" fill="#8888aa" font-size="9">단축키 입력 (Ctrl+S 등)</text>

  <rect x="462" y="794" width="210" height="52" rx="8" fill="#1a0a0a" stroke="#f87171" stroke-width="1"/>
  <text x="567" y="812" text-anchor="middle" fill="#f87171" font-size="10" font-weight="600">calendar.py (1)</text>
  <text x="567" y="826" text-anchor="middle" fill="#8888aa" font-size="9">Google Calendar 일정 등록</text>
  <text x="567" y="839" text-anchor="middle" fill="#8888aa" font-size="9">URL 스킴 fallback</text>

  <!-- ════════════════════════════════════════════
       LAYER 6: Services + Config
  ════════════════════════════════════════════ -->
  <rect x="30" y="870" width="318" height="96" rx="10" fill="#1c1c2c" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="46" y="890" fill="#38bdf8" font-size="11" font-weight="700">⑥ 서비스 레이어  (services/)</text>

  <rect x="46" y="898" width="140" height="54" rx="8" fill="#0a1520" stroke="#38bdf8" stroke-width="1"/>
  <text x="116" y="916" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="600">STT  (stt.py)</text>
  <text x="116" y="930" text-anchor="middle" fill="#8888aa" font-size="9">온라인: Google STT</text>
  <text x="116" y="943" text-anchor="middle" fill="#8888aa" font-size="9">오프라인: faster-whisper</text>

  <rect x="204" y="898" width="130" height="54" rx="8" fill="#0a1520" stroke="#38bdf8" stroke-width="1"/>
  <text x="269" y="916" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="600">TTS  (tts.py)</text>
  <text x="269" y="930" text-anchor="middle" fill="#8888aa" font-size="9">edge-tts (Microsoft)</text>
  <text x="269" y="943" text-anchor="middle" fill="#8888aa" font-size="9">텍스트 → MP3 bytes</text>

  <rect x="372" y="870" width="318" height="96" rx="10" fill="#1c1c2c" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="388" y="890" fill="#a78bfa" font-size="11" font-weight="700">⑦ 설정 &amp; 진입점</text>

  <rect x="388" y="898" width="130" height="54" rx="8" fill="#12102a" stroke="#a78bfa" stroke-width="1"/>
  <text x="453" y="916" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="600">settings.py</text>
  <text x="453" y="930" text-anchor="middle" fill="#8888aa" font-size="9">pydantic-settings</text>
  <text x="453" y="943" text-anchor="middle" fill="#8888aa" font-size="9">.env → provider/key 로드</text>

  <rect x="530" y="898" width="146" height="54" rx="8" fill="#12102a" stroke="#a78bfa" stroke-width="1"/>
  <text x="603" y="916" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="600">start.bat</text>
  <text x="603" y="930" text-anchor="middle" fill="#8888aa" font-size="9">pip install → uvicorn</text>
  <text x="603" y="943" text-anchor="middle" fill="#8888aa" font-size="9">→ electron . 실행</text>
</svg>
