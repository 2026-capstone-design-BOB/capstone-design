<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <rect width="900" height="420" fill="#111318"/>

  <!-- 제목 -->
  <text x="450" y="36" text-anchor="middle" fill="#4fc3f7" font-size="17" font-weight="bold">Pluiz v2 — 핵심 개념</text>
  <text x="450" y="58" text-anchor="middle" fill="#667" font-size="12">말하면 PC가 움직인다</text>

  <!-- ═══ LEFT: 사람 + 음성 ═══ -->
  <!-- 사람 실루엣 -->
  <circle cx="120" cy="145" r="28" fill="#1e2a3a" stroke="#4fc3f7" stroke-width="2"/>
  <text x="120" y="153" text-anchor="middle" font-size="28">🧑</text>
  <rect x="90" y="175" width="60" height="55" rx="10" fill="#1e2a3a" stroke="#4fc3f7" stroke-width="2"/>
  <line x1="90" y1="230" x2="72" y2="270" stroke="#4fc3f7" stroke-width="2" stroke-linecap="round"/>
  <line x1="150" y1="230" x2="168" y2="270" stroke="#4fc3f7" stroke-width="2" stroke-linecap="round"/>

  <!-- 마이크 아이콘 -->
  <rect x="109" y="183" width="22" height="30" rx="11" fill="none" stroke="#4fc3f7" stroke-width="2"/>
  <path d="M103 208 Q103 225 120 225 Q137 225 137 208" stroke="#4fc3f7" stroke-width="2" fill="none"/>
  <line x1="120" y1="225" x2="120" y2="235" stroke="#4fc3f7" stroke-width="2"/>

  <!-- 음성 파형 -->
  <text x="120" y="310" text-anchor="middle" fill="#4fc3f7" font-size="13">사용자</text>

  <!-- 말풍선 -->
  <rect x="160" y="100" width="170" height="44" rx="8" fill="#1a2535" stroke="#4fc3f7" stroke-width="1.5"/>
  <polygon points="160,122 148,118 160,132" fill="#1a2535" stroke="#4fc3f7" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="245" y="118" text-anchor="middle" fill="#ccc" font-size="12">"메모장 열어줘"</text>
  <text x="245" y="136" text-anchor="middle" fill="#778" font-size="10">한국어 음성 / 텍스트</text>

  <!-- 음파 -->
  <path d="M158 185 Q165 178 158 171" stroke="#4fc3f7" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M164 189 Q175 178 164 167" stroke="#4fc3f7" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M170 193 Q185 178 170 163" stroke="#4fc3f7" stroke-width="1.5" fill="none" opacity="0.3"/>

  <!-- ═══ CENTER: Pluiz ═══ -->
  <!-- Pluiz 코어 원 -->
  <circle cx="450" cy="200" r="72" fill="#161b24" stroke="#4fc3f7" stroke-width="2.5"/>
  <circle cx="450" cy="200" r="60" fill="#111318" stroke="#253040" stroke-width="1"/>
  <!-- 회전 아크 (장식) -->
  <path d="M 450 132 A 68 68 0 0 1 518 200" stroke="#4fc3f7" stroke-width="1.5" fill="none" stroke-dasharray="8,5" opacity="0.4"/>
  <path d="M 450 268 A 68 68 0 0 1 382 200" stroke="#4fc3f7" stroke-width="1.5" fill="none" stroke-dasharray="8,5" opacity="0.4"/>

  <text x="450" y="193" text-anchor="middle" fill="#4fc3f7" font-size="22" font-weight="bold">Pluiz</text>
  <text x="450" y="213" text-anchor="middle" fill="#667" font-size="10">AI Agent</text>
  <!-- 내부 3단계 표시 -->
  <text x="450" y="233" text-anchor="middle" fill="#334455" font-size="8.5">Security → Cache → LLM</text>

  <!-- 화살표 좌 → 중 -->
  <line x1="338" y1="200" x2="374" y2="200" stroke="#4fc3f7" stroke-width="2" marker-end="url(#arr-b)"/>
  <text x="356" y="193" text-anchor="middle" fill="#445" font-size="9">음성/텍스트</text>

  <!-- 화살표 중 → 우 -->
  <line x1="526" y1="200" x2="562" y2="200" stroke="#66bb6a" stroke-width="2" marker-end="url(#arr-g)"/>
  <text x="544" y="193" text-anchor="middle" fill="#445" font-size="9">도구 실행</text>

  <!-- ═══ RIGHT: PC 제어 결과 ═══ -->
  <!-- PC 모니터 -->
  <rect x="570" y="110" width="240" height="160" rx="10" fill="#1a1e28" stroke="#66bb6a" stroke-width="2"/>
  <rect x="582" y="122" width="216" height="126" rx="6" fill="#0d1117"/>
  <!-- 스탠드 -->
  <rect x="674" y="270" width="12" height="25" fill="#1a1e28"/>
  <rect x="650" y="293" width="60" height="8" rx="3" fill="#1a1e28" stroke="#66bb6a" stroke-width="1"/>

  <!-- 모니터 안 — 앱들 -->
  <!-- 메모장 -->
  <rect x="592" y="132" width="62" height="50" rx="4" fill="#1e2a3a" stroke="#4fc3f7" stroke-width="1"/>
  <rect x="592" y="132" width="62" height="14" rx="4" fill="#253040"/>
  <text x="623" y="143" text-anchor="middle" fill="#aaa" font-size="8">메모장</text>
  <line x1="598" y1="154" x2="648" y2="154" stroke="#334" stroke-width="1"/>
  <line x1="598" y1="161" x2="648" y2="161" stroke="#334" stroke-width="1"/>
  <line x1="598" y1="168" x2="635" y2="168" stroke="#334" stroke-width="1"/>

  <!-- 볼륨 -->
  <rect x="662" y="132" width="62" height="50" rx="4" fill="#1e2a3a" stroke="#66bb6a" stroke-width="1"/>
  <rect x="662" y="132" width="62" height="14" rx="4" fill="#1e3025"/>
  <text x="693" y="143" text-anchor="middle" fill="#aaa" font-size="8">볼륨</text>
  <text x="693" y="167" text-anchor="middle" fill="#66bb6a" font-size="18">🔊</text>
  <rect x="670" y="174" width="46" height="5" rx="2" fill="#1a3025"/>
  <rect x="670" y="174" width="34" height="5" rx="2" fill="#66bb6a"/>

  <!-- 유튜브 -->
  <rect x="732" y="132" width="62" height="50" rx="4" fill="#1e2a3a" stroke="#ff7043" stroke-width="1"/>
  <rect x="732" y="132" width="62" height="14" rx="4" fill="#2a1a15"/>
  <text x="763" y="143" text-anchor="middle" fill="#aaa" font-size="8">YouTube</text>
  <rect x="742" y="152" width="42" height="24" rx="3" fill="#ff0000" opacity="0.8"/>
  <polygon points="754,158 754,170 767,164" fill="white"/>

  <!-- 파일 탐색기 -->
  <rect x="592" y="190" width="62" height="50" rx="4" fill="#1e2a3a" stroke="#ffc107" stroke-width="1"/>
  <rect x="592" y="190" width="62" height="14" rx="4" fill="#252015"/>
  <text x="623" y="201" text-anchor="middle" fill="#aaa" font-size="8">파일 탐색기</text>
  <text x="623" y="228" text-anchor="middle" fill="#ffc107" font-size="18">📁</text>

  <!-- 스크린샷 -->
  <rect x="662" y="190" width="62" height="50" rx="4" fill="#1e2a3a" stroke="#9c27b0" stroke-width="1"/>
  <rect x="662" y="190" width="62" height="14" rx="4" fill="#1e152a"/>
  <text x="693" y="201" text-anchor="middle" fill="#aaa" font-size="8">스크린샷</text>
  <text x="693" y="228" text-anchor="middle" fill="#ce93d8" font-size="18">📷</text>

  <!-- 지도 -->
  <rect x="732" y="190" width="62" height="50" rx="4" fill="#1e2a3a" stroke="#4caf50" stroke-width="1"/>
  <rect x="732" y="190" width="62" height="14" rx="4" fill="#152015"/>
  <text x="763" y="201" text-anchor="middle" fill="#aaa" font-size="8">지도</text>
  <text x="763" y="228" text-anchor="middle" fill="#66bb6a" font-size="18">🗺️</text>

  <text x="690" y="335" text-anchor="middle" fill="#66bb6a" font-size="13">Windows PC</text>

  <!-- ═══ BOTTOM: TTS ═══ -->
  <!-- 음성 응답 화살표 (아래 루프) -->
  <path d="M 450 275 Q 450 370 120 370 Q 120 330 120 300" stroke="#9e9e9e" stroke-width="1.5" fill="none" stroke-dasharray="6,4" marker-end="url(#arr-gray)"/>
  <rect x="260" y="358" width="180" height="26" rx="5" fill="#1a1e28" stroke="#555" stroke-width="1"/>
  <text x="350" y="375" text-anchor="middle" fill="#999" font-size="11">🔊 "메모장을 열었습니다"</text>
  <text x="350" y="395" text-anchor="middle" fill="#445" font-size="9">TTS 음성 응답 (edge-tts)</text>

  <!-- ═══ LEGEND / 라벨 ═══ -->
  <text x="450" y="390" text-anchor="middle" fill="#334" font-size="9">도구 27종 · 한국어 특화 · 오프라인 핵심 동작 · always-on-top 오버레이</text>

  <!-- markers -->
  <defs>
    <marker id="arr-b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#4fc3f7"/>
    </marker>
    <marker id="arr-g" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#66bb6a"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#9e9e9e"/>
    </marker>
  </defs>
</svg>
