<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' http://127.0.0.1:8765 ws://127.0.0.1:8765 blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; media-src blob: http://127.0.0.1:8765;">
  <title>Pluiz</title>
  <style>
    :root {
      --accent: #7c6fef;
      --danger: #f87171;
      --warn: #fbbf24;
      --ok: #4ade80;
      --text: #e8e8f0;
      --muted: #8888aa;
      --bg: rgba(14, 14, 22, 0.96);
      --surf: rgba(28, 28, 44, 0.97);
      --border: rgba(124, 111, 239, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100vh;
      background: transparent;
      overflow: hidden;
      font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
      color: var(--text);
    }

    .card {
      position: relative;
      width: 100%;
      height: 100vh;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      backdrop-filter: blur(16px);
      box-shadow: 0 6px 40px rgba(0, 0, 0, .6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-app-region: drag;
    }

    /* ── SETTINGS OVERLAY ───────────────────────────────────── */
    .settings-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg);
      border-radius: 20px;
      z-index: 1000;
      display: none;
      flex-direction: column;
      overflow: hidden;
      -webkit-app-region: drag;
    }

    .settings-overlay.show {
      display: flex;
    }

    .s-header {
      height: 44px;
      display: flex;
      align-items: center;
      padding: 0 10px 0 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surf);
      flex-shrink: 0;
    }

    .s-header-title {
      flex: 1;
      font-size: 13px;
      font-weight: 600;
    }

    .s-body {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 11px;
      -webkit-app-region: no-drag;
      overflow-y: auto;
    }

    .s-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    .provider-tabs {
      display: flex;
      gap: 6px;
    }

    .ptab {
      flex: 1;
      padding: 7px 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      transition: all .15s;
    }

    .ptab.active {
      background: rgba(124, 111, 239, .2);
      border-color: var(--accent);
      color: var(--text);
      font-weight: 600;
    }

    .ptab:hover:not(.active) {
      background: rgba(255, 255, 255, .05);
      color: var(--text);
    }

    .s-label {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .s-input {
      width: 100%;
      padding: 8px 10px;
      background: rgba(28, 28, 44, .9);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 12px;
      outline: none;
      transition: border-color .15s;
      font-family: inherit;
    }

    .s-input:focus {
      border-color: var(--accent);
    }

    .s-input::placeholder {
      color: var(--muted);
    }

    .s-link {
      font-size: 11px;
      color: var(--accent);
      text-decoration: none;
      display: inline-block;
      margin-top: 5px;
    }

    .s-link:hover {
      text-decoration: underline;
    }

    .s-status {
      font-size: 12px;
      min-height: 16px;
    }

    .s-status.ok {
      color: var(--ok);
    }

    .s-status.err {
      color: var(--danger);
    }

    .s-actions {
      display: flex;
      gap: 8px;
    }

    /* ── 웨이크워드 설정 (BL-13) ─────────────────────────────── */
    .s-divider {
      height: 1px;
      background: var(--border);
      margin: 2px 0;
    }

    .s-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    /* 체크박스는 OS 기본 모양이 창 테마와 어긋나서 직접 그린다. */
    .s-toggle {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
      font-size: 12px;
      color: var(--text);
      user-select: none;
    }

    .s-toggle input {
      appearance: none;
      -webkit-appearance: none;
      width: 34px;
      height: 19px;
      border-radius: 999px;
      background: rgba(28, 28, 44, .9);
      border: 1px solid var(--border);
      position: relative;
      cursor: pointer;
      transition: background .16s, border-color .16s;
      flex: none;
    }

    .s-toggle input::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--muted);
      transition: transform .16s, background .16s;
    }

    .s-toggle input:checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    .s-toggle input:checked::after {
      transform: translateX(15px);
      background: #fff;
    }

    .s-toggle input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .s-mini-btn {
      padding: 6px 12px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: var(--text);
      font-size: 11px;
      cursor: pointer;
      flex: none;
      transition: border-color .16s, color .16s;
    }

    .s-mini-btn:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    .s-mini-btn:disabled {
      opacity: .5;
      cursor: default;
    }

    .s-save-btn {
      flex: 1;
      padding: 9px 0;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
    }

    .s-save-btn:hover {
      background: #5b51d8;
    }

    .s-save-btn:disabled {
      background: var(--surf);
      color: var(--muted);
      cursor: not-allowed;
    }

    .s-cancel-btn {
      padding: 9px 14px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      transition: all .15s;
    }

    .s-cancel-btn:hover {
      border-color: var(--text);
      color: var(--text);
    }

    /* ── IDLE ────────────────────────────────────────────────── */
    .idle-view {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px 0 12px;
      cursor: pointer;
    }

    .logo-ring {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .logo-ring.listening {
      animation: ring-breathe 2.5s ease-in-out infinite;
    }

    .logo-ring.awake {
      animation: ring-wake .5s ease forwards;
    }

    @keyframes ring-breathe {

      0%,
      100% {
        box-shadow: 0 0 0 2px rgba(74, 222, 128, .35)
      }

      50% {
        box-shadow: 0 0 0 7px rgba(74, 222, 128, .08)
      }
    }

    @keyframes ring-wake {
      0% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(251, 191, 36, .9)
      }

      40% {
        transform: scale(1.3);
        box-shadow: 0 0 0 12px rgba(251, 191, 36, 0)
      }

      100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(251, 191, 36, 0)
      }
    }

    .idle-info {
      flex: 1;
      min-width: 0;
    }

    .idle-name {
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .idle-hint {
      font-size: 10px;
      color: var(--muted);
      margin-top: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .idle-actions {
      display: flex;
      gap: 4px;
      align-items: center;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }

    .idle-icon-btn {
      width: 30px;
      height: 30px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(124, 111, 239, .07);
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s;
    }

    .idle-icon-btn:hover {
      background: rgba(124, 111, 239, .2);
      color: var(--text);
      border-color: var(--accent);
    }

    .idle-icon-btn.mic-idle:hover {
      background: rgba(248, 113, 113, .15);
      color: var(--danger);
      border-color: var(--danger);
    }

    /* dots */
    .sdot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }

    .sdot.ok {
      background: var(--ok);
      box-shadow: 0 0 6px var(--ok);
      animation: dot-b 2.5s ease-in-out infinite;
    }

    .sdot.warn {
      background: var(--warn);
      box-shadow: 0 0 6px var(--warn);
      animation: dot-f .7s ease-in-out infinite;
    }

    .sdot.off {
      background: var(--danger);
      box-shadow: 0 0 5px var(--danger);
    }

    .sdot.spin {
      background: var(--warn);
      box-shadow: 0 0 5px var(--warn);
      animation: dot-f .7s ease-in-out infinite;
    }

    /* 화면 감시 중 배지 — 감시가 돌고 있다는 걸 사용자가 항상 볼 수 있어야 한다.
       "켜 둔 걸 잊는 것"이 이 기능의 가장 큰 위험이다. */
    .watch-badge {
      display: none;
      font-size: 11px;
      line-height: 1;
      margin-left: 4px;
      opacity: .9;
      animation: dot-b 2.5s ease-in-out infinite;
    }

    .watch-badge.show {
      display: inline-block;
    }

    @keyframes dot-b {

      0%,
      100% {
        opacity: .5;
        transform: scale(1)
      }

      50% {
        opacity: 1;
        transform: scale(1.3)
      }
    }

    @keyframes dot-f {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .25
      }
    }

    /* ── ACTIVE ──────────────────────────────────────────────── */
    .active-view {
      display: none;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .a-header {
      height: 44px;
      display: flex;
      align-items: center;
      padding: 0 8px 0 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surf);
      flex-shrink: 0;
      -webkit-app-region: drag;
      cursor: pointer;
    }

    .a-title {
      flex: 1;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .a-logo {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      background: linear-gradient(135deg, var(--accent), #a78bfa);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    .hbtn {
      width: 28px;
      height: 28px;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      transition: all .15s;
      -webkit-app-region: no-drag;
      flex-shrink: 0;
    }

    .hbtn:hover {
      background: rgba(255, 255, 255, .08);
      color: var(--text);
    }

    .hbtn.close:hover {
      background: rgba(248, 113, 113, .18);
      color: var(--danger);
    }

    .voice-zone {
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 16px 8px;
      gap: 7px;
      border-bottom: 1px solid var(--border);
      -webkit-app-region: no-drag;
    }

    .waveform {
      display: flex;
      gap: 3px;
      align-items: center;
      height: 28px;
    }

    .bar {
      width: 3px;
      background: var(--accent);
      border-radius: 3px;
      height: 5px;
    }

    .wf-rec .bar {
      background: var(--danger);
      animation: wav .5s ease-in-out infinite;
    }

    .wf-proc .bar {
      background: var(--warn);
      animation: wav 1.0s ease-in-out infinite;
    }

    @keyframes wav {

      0%,
      100% {
        height: 4px
      }

      50% {
        height: 22px
      }
    }

    .bar:nth-child(1) {
      animation-delay: 0s
    }

    .bar:nth-child(2) {
      animation-delay: .07s
    }

    .bar:nth-child(3) {
      animation-delay: .14s
    }

    .bar:nth-child(4) {
      animation-delay: .21s
    }

    .bar:nth-child(5) {
      animation-delay: .28s
    }

    .bar:nth-child(6) {
      animation-delay: .07s
    }

    .bar:nth-child(7) {
      animation-delay: .14s
    }

    .state-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .state-lbl {
      font-size: 12px;
      color: var(--muted);
      min-width: 90px;
      text-align: center;
    }

    .state-lbl.rec {
      color: var(--danger);
      font-weight: 600;
    }

    .state-lbl.proc {
      color: var(--warn);
    }

    .cd-ring {
      position: relative;
      width: 44px;
      height: 44px;
      display: none;
    }

    .cd-ring.show {
      display: block;
    }

    .cd-ring svg {
      transform: rotate(-90deg);
    }

    .cd-ring .tr {
      fill: none;
      stroke: rgba(248, 113, 113, .2);
      stroke-width: 3;
    }

    .cd-ring .pr {
      fill: none;
      stroke: var(--danger);
      stroke-width: 3;
      stroke-linecap: round;
      stroke-dasharray: 120;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset .1s linear;
    }

    .cd-num {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 12px;
      font-weight: 700;
      color: var(--danger);
    }

    /* BL-33 — 링이 «남은 8초»가 아니라 «내 말이 들어가고 있는가»를 보여준다.
       남은 시간은 사용자가 알 필요가 없다. 알아야 하는 건 들리고 있는지다.
       .idle = 아직 말이 시작되지 않음(회색) · 말이 잡히면 빨강으로 넘어간다 */
    .cd-ring .pr {
      transition: stroke-dashoffset .06s linear;
    }

    .cd-ring.idle .pr {
      stroke: rgba(148, 163, 184, .5);
    }

    .cd-ring.idle .cd-num {
      color: rgba(148, 163, 184, .85);
    }

    .mic-btn {
      width: 44px;
      height: 44px;
      border: 2px solid var(--border);
      border-radius: 50%;
      background: rgba(124, 111, 239, .1);
      color: var(--accent);
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .2s;
      -webkit-app-region: no-drag;
    }

    .mic-btn:hover {
      background: rgba(124, 111, 239, .22);
      border-color: var(--accent);
    }

    .mic-btn.rec {
      background: rgba(248, 113, 113, .15);
      border-color: var(--danger);
      color: var(--danger);
      animation: mic-p 1s ease-in-out infinite;
    }

    @keyframes mic-p {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(248, 113, 113, .5)
      }

      50% {
        box-shadow: 0 0 0 9px rgba(248, 113, 113, 0)
      }
    }

    .chat-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      -webkit-app-region: no-drag;
    }

    .chat-list::-webkit-scrollbar {
      width: 3px;
    }

    .chat-list::-webkit-scrollbar-thumb {
      background: var(--surf);
      border-radius: 3px;
    }

    .msg {
      display: flex;
      gap: 6px;
      max-width: 96%;
      animation: fadeUp .15s ease;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(4px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .msg.u {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg.a {
      align-self: flex-start;
    }

    .av {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    .av.u {
      background: var(--accent);
    }

    .av.a {
      background: linear-gradient(135deg, #1e3a5f, #2a4a7f);
      border: 1px solid var(--border);
    }

    .bbl {
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.u .bbl {
      background: rgba(36, 36, 58, .9);
      border: 1px solid var(--border);
      border-top-right-radius: 3px;
    }

    .msg.a .bbl {
      background: rgba(20, 40, 60, .9);
      border: 1px solid rgba(30, 90, 150, .3);
      border-top-left-radius: 3px;
    }

    .typing {
      display: none;
      align-self: flex-start;
      gap: 6px;
      align-items: center;
    }

    .typing.show {
      display: flex;
    }

    .dots {
      display: flex;
      gap: 3px;
      padding: 6px 10px;
      background: rgba(20, 40, 60, .9);
      border-radius: 10px;
      border: 1px solid rgba(30, 90, 150, .3);
    }

    .d {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--muted);
      animation: bop .9s infinite;
    }

    .d:nth-child(2) {
      animation-delay: .15s
    }

    .d:nth-child(3) {
      animation-delay: .3s
    }

    @keyframes bop {

      0%,
      60%,
      100% {
        transform: translateY(0)
      }

      30% {
        transform: translateY(-5px)
      }
    }

    .input-row {
      display: flex;
      gap: 6px;
      padding: 8px 8px 10px;
      align-items: flex-end;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }

    #txt {
      flex: 1;
      background: rgba(28, 28, 44, .9);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 10px;
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      resize: none;
      max-height: 60px;
      min-height: 28px;
      line-height: 1.45;
      outline: none;
    }

    #txt::placeholder {
      color: var(--muted);
    }

    #txt:focus {
      border-color: var(--accent);
    }

    .send-btn {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 9px;
      background: var(--accent);
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .15s;
      flex-shrink: 0;
    }

    .send-btn:hover {
      background: #5b51d8;
    }

    .send-btn:disabled {
      background: var(--surf);
      color: var(--muted);
      cursor: not-allowed;
    }

    .card.active .idle-view {
      display: none;
    }

    .card.active .active-view {
      display: flex;
    }

    /* ── HISTORY VIEW ───────────────────────────────────────── */
    .history-view {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 8px 10px;
      display: none;
      flex-direction: column;
      gap: 4px;
      -webkit-app-region: no-drag;
    }

    .history-view.show {
      display: flex;
    }

    .history-view::-webkit-scrollbar { width: 3px; }
    .history-view::-webkit-scrollbar-thumb { background: var(--surf); border-radius: 3px; }

    .hist-hdr {
      font-size: 11px;
      color: var(--muted);
      padding: 2px 0 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .hist-hdr span { font-weight: 600; }

    .hist-clear-btn {
      font-size: 11px;
      color: var(--danger);
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 5px;
      -webkit-app-region: no-drag;
    }

  <script>
    const API = 'http://127.0.0.1:8765';

    // ── 로컬 API 접근 토큰 (BL-14) ────────────────────────────────
    // 서버가 기동할 때 발급해 cache/.auth_token 에 적은 값을 main.js가 읽어 준다.
    // 이게 없으면 서버가 401을 돌려준다 — 아무 웹페이지가 PC 제어 명령을 넣지
    // 못하게 하는 장치다. (docs/BACKLOG.md BL-14)
    //
    // 호출부를 하나하나 고치는 대신 fetch를 한 번 감싼다. API로 가는 요청에만
    // 헤더를 붙이므로 기존 fetch 호출 6곳은 그대로 둔다.
    // (/voice의 FormData도 헤더만 추가하므로 Content-Type 경계가 깨지지 않는다)
    let AUTH_TOKEN = '';
    const _fetch = window.fetch.bind(window);
    window.fetch = async (url, opts = {}) => {
      if (typeof url === 'string' && url.startsWith(API)) {
        // 매번 ensureToken()을 거친다. 이미 받아 뒀으면 즉시 반환하고, 서버가
        // 재시작돼 토큰이 바뀌었으면 파일에서 새로 읽는다.
        const t = await ensureToken();
        opts = { ...opts, headers: { ...(opts.headers || {}), 'X-Pluiz-Token': t } };
      }
      return _fetch(url, opts);
    };

    // 재연결 루프가 3초마다 부르므로 요청이 겹치지 않게 진행 중인 것을 재사용한다.
    let _tokenPromise = null;
    async function ensureToken() {
      if (AUTH_TOKEN) return AUTH_TOKEN;
      if (!_tokenPromise) {
        _tokenPromise = window.pluiz.getToken().catch(e => {
          console.error('[auth] 토큰 수령 실패', e);
          return '';
        });
      }
      AUTH_TOKEN = (await _tokenPromise) || '';
      if (!AUTH_TOKEN) _tokenPromise = null;   // 서버가 아직 없다 → 다음에 다시 시도
      return AUTH_TOKEN;
    }

    let ws = null;
    let threadId = 'pluiz_' + Date.now();
    let busy = false;
    let isActive = false;
    let isRec = false;
    let mr = null;
    let chunks = [];
    let streamEl = null;
    let apiChecked = false;
    let hasExistingKey = false;
    let selectedProvider = 'gemini';

    const PROVIDER_LINKS = {
      gemini: 'https://aistudio.google.com/apikey',
      claude: 'https://console.anthropic.com/',
      openai: 'https://platform.openai.com/api-keys',
    };

    // ── 발화 종료 감지 (VAD) — 2026-09-11 BL-33 ────────────────────
    // 전에는 `REC_SEC = 8` 타이머 하나가 «사람이 말을 끝낸 시점»을 대신했다.
    // 말이 길면 뒷말이 잘리고, 짧으면 남은 초를 멍하니 기다렸다.
    // 이제 같은 MediaStream에 AnalyserNode를 붙여 프레임마다 RMS를 본다.
    //
    // 절대 규칙
    //   ⚠️ MAX_MS(상한)를 없애지 말 것 — 무음 감지가 환경 소음에 속으면
    //      상한이 «끝나지 않는 녹음»을 막는 유일한 방어선이다.
    //   ⚠️ START_RMS와 KEEP_RMS를 하나로 합치지 말 것 — 히스테리시스다.
    //      하나면 임계 근처에서 말이 «시작·끝·시작»으로 튄다.
    //
    // 임계 출발점은 services/wakeword.py의 에너지 관문(RMS 0.006)이다 —
    // 같은 마이크·같은 샘플레이트를 본다. 실제 목소리로 재보고 맞춘다
    // (콘솔에 [VAD] 줄로 잡음 바닥과 최대 RMS가 찍힌다).
    const VAD = {
      START_RMS: 0.020,    // 이 위로 오르면 «말이 시작됐다»
      KEEP_RMS: 0.012,     // 이 아래로 내려가면 «무음»(히스테리시스)
      SILENCE_MS: 1200,    // 말 시작 후 이만큼 조용하면 종료
      NOSPEECH_MS: 6000,   // 한 마디도 없으면 접는다 — STT를 부르지 않는다
      MAX_MS: 30000,       // ⚠️ 상한. 지우지 말 것
      FLOOR_MS: 400,       // 시작 직후 이 구간의 잡음을 «바닥»으로 잰다
      FLOOR_MULT: 3,       // 조용한 방이면 START_RMS가, 시끄러우면 바닥x3이 이긴다
      FLOOR_MAX: 0.06,     // 바닥이 터무니없이 높아도 여기서 멈춘다(마이크가 죽지 않게)
      TICK_MS: 50,         // requestAnimationFrame을 쓰지 않는다 — 창이 뒤로 가면
                           //   프레임이 throttle돼 «무음»을 영영 못 본다
      // 웨이크워드가 **자동으로** 연 녹음은 더 빨리 접는다. 헛깨어남이면
      // 오버레이가 떠 있는 시간이 그만큼 짧아진다(BL-23 완화).
      // ⚠️ 너무 줄이면 «플루이즈» 하고 숨 고르는 사람을 자른다. 4초로 둔다.
      NOSPEECH_AUTO_MS: 4000,
    };
    const CIRCUM = 2 * Math.PI * 19;
    let vadTimer = null, vadMaxTimer = null, vadCtx = null, vadPeak = 0;

    // ── 헛깨어남을 조용히 닫는다 (2026-09-11, BL-23 완화) ─────────
    // 웨이크워드 오탐은 **모델 문제**라 10월 재구축 전에는 못 줄인다
    // (→ docs/design/M7_웨이크워드_재구축.md). 대신 **보이는 증상**은 지운다.
    //
    // 실기 2026-09-11: 헛깨어남 → 오버레이가 열림 → 주변 말소리를 녹음 →
    // STT가 해독 실패 → *«⚠️ 음성을 인식하지 못했습니다»* 가 채팅에 남았다.
    // **사용자가 시킨 적이 없는 턴이다.** 오류를 보여 줄 이유가 없다.
    //
    // ⚠️ 마이크 버튼·Alt+Space로 **사람이 직접 연 녹음은 그대로 오류를 보여준다** —
    //    그건 사용자가 결과를 기다리는 턴이라 조용히 삼키면 그게 더 나쁘다.
    //    («조용히 끝나지 않는다»는 BL-22·BL-19의 규칙이 거기에 적용된다)

    let micDiscard = false;

    async function loadHistory() {
      const listEl = document.getElementById('hist-list');
      listEl.innerHTML = '<div class="hist-empty">불러오는 중...</div>';
      try {
        const res = await fetch(`${API}/history?n=30`);
        const data = await res.json();
        const items = data.history || [];
        if (items.length === 0) {
          listEl.innerHTML = '<div class="hist-empty">대화 기록이 없어요.</div>';
          return;
        }
        listEl.innerHTML = '';
        // 최신순 (reversed)
        for (let i = items.length - 1; i >= 0; i--) {
          const item = items[i];
          const el = document.createElement('div');
          el.className = 'hist-item';
          const t = item.time ? item.time.replace('T', ' ').slice(0, 16) : '';
          el.innerHTML =
            `<div class="hist-user">👤 ${esc(item.user)}</div>` +
            `<div class="hist-agent">🤖 ${esc(item.agent)}</div>` +
            (t ? `<div class="hist-time">${t}</div>` : '');
          el.onclick = () => rerunFromHistory(item.user);
          listEl.appendChild(el);
        }
      } catch (e) {
        listEl.innerHTML = '<div class="hist-empty">기록을 불러오지 못했어요.</div>';
      }
    }

    async function clearHistory() {

    function rerunFromHistory(text) {
      hideHistory();
      const el = document.getElementById('txt');
      el.value = text;
      resizeTxt(el);
      el.focus();

    }

    // ── WebSocket ──────────────────────────────────────────────────
    async function connect() {
      // 토큰을 먼저 확보한다. 브라우저 WS는 헤더를 못 붙이므로 쿼리로 보낸다 (BL-14).
      // 서버가 아직 안 떴으면 토큰이 비어 오는데, 그땐 아래 onclose가 3초 뒤 다시 시도한다.
      await ensureToken();
      ws = new WebSocket('ws://127.0.0.1:8765/ws?token=' + encodeURIComponent(AUTH_TOKEN));

      ws.onopen = () => {
        setDots(true);
        if (!apiChecked) {
          apiChecked = true;
          checkApiConfig();
        }
      };
      ws.onclose = () => {
        setDots(false);
        // 토큰을 버리고 다시 읽는다. 서버를 재시작하면 토큰이 바뀌는데(BL-14),
        // 메모리에 든 옛 토큰을 계속 쓰면 재연결이 영영 401/1008로 거절된다.
        AUTH_TOKEN = '';
        _tokenPromise = null;
        setTimeout(connect, 3000);
      };
      ws.onerror = () => setDots(false);

      ws.onmessage = e => {
        const m = JSON.parse(e.data);
        if (m.type === 'start') {
          showTyping(false);
          streamEl = addMsg('a', '');
        } else if (m.type === 'chunk') {
          if (streamEl) streamEl.querySelector('.bbl').textContent += m.content;
          scrollChat();
        } else if (m.type === 'end') {
          if (streamEl) { streamEl.querySelector('.bbl').textContent = m.full; streamEl = null; }
          if (m.audio_base64) playAudio(m.audio_base64);
          setBusy(false); setState('ready'); setWf('');
        } else if (m.type === 'error') {
          addMsg('a', '⚠️ ' + m.message);
          setBusy(false); setState('ready'); setWf('');
        } else if (m.type === 'notify') {
          // 화면 감시 알림. 사용자가 시킨 턴이 아니라 **서버가 먼저 거는 말**이라
          // start/chunk/end 흐름과 독립적이다. streamEl·busy를 건드리지 않는다.
          onWatchNotify(m);
        } else if (m.type === 'watch_state') {
          setWatchBadge(m.active);
        } else if (m.type === 'point') {
          // 포인팅 표시(M4). 감시 알림과 같은 이유로 start/chunk/end와 독립이고,
          // 창을 앞으로 꺼내지 **않는다** — 사용자가 보던 화면을 가리키는 것이라
          // 우리 창이 앞에 나오면 정작 가리킨 자리를 덮는다.
          window.pluiz.pointShow(m);
        } else if (m.type === 'point_clear') {
          window.pluiz.pointHide();
        }
      };
    }

    function setDots(ok) {
      const cls = ok ? 'sdot ok' : 'sdot off';
      document.getElementById('sdot').className = cls;
      document.getElementById('sdot2').className = cls;
      const ring = document.getElementById('logo-ring');
      ok ? ring.classList.add('listening') : ring.classList.remove('listening');
      document.getElementById('idle-hint').textContent =
        ok ? '더블클릭 · 🎙️' : '서버 연결 중...';
    }

    // ── 내보내기 / 가져오기 (M6) ───────────────────────────────────
    //
    // ⚠️ window.fetch가 토큰을 자동으로 실어 주지만(위 래퍼), 파일 **다운로드**는
    //    fetch로 받아 blob으로 떨궈야 한다 — <a href>로 걸면 토큰이 안 실려
    //    401이 나고, 사용자에겐 «그 버튼만 조용히 안 되는» 것으로 보인다(BL-14).
    function portableStatus(msg, bad) {
      const el = document.getElementById('portable-status');
      if (!el) return;
      el.textContent = msg || '';
      el.style.color = bad ? '#e66' : '';
    }

    async function exportBundle() {
      const btn = document.getElementById('export-btn');
      if (btn) btn.disabled = true;
      portableStatus('내보내는 중…');
      try {
        const r = await fetch(`${API}/export`);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const blob = await r.blob();
        // 파일 이름은 서버가 정한다 (날짜가 들어간다)
        let name = 'pluiz-export.zip';
        const cd = r.headers.get('content-disposition') || '';
        const m = cd.match(/filename="([^"]+)"/);
        if (m) name = m[1];
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        portableStatus(`${name} 으로 저장했어요.`);
      } catch (e) {
        console.error('[portable] 내보내기 실패', e);
        portableStatus('내보내지 못했어요. 서버가 켜져 있는지 확인해 주세요.', true);
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    function pickImportFile() {
      const el = document.getElementById('import-file');
      if (el) { el.value = ''; el.click(); }
    }

    async function importBundle(file) {
      if (!file) return;
      // 되돌릴 수 없는 변경이다 — 한 번 묻는다.
      // (서버가 백업을 남기지만, 사용자는 그걸 모른 채 누른다)
      if (!confirm(
            `'${file.name}' 을(를) 가져올까요?\n\n` +
            '배운 명령과 즐겨찾기가 더해집니다. 이미 있는 건 그대로 둡니다.\n' +
            '바꾸기 전 상태는 자동으로 백업돼요.')) {
        return;
      }
      const btn = document.getElementById('import-btn');
      if (btn) btn.disabled = true;
      portableStatus('가져오는 중…');
      try {
        const fd = new FormData();
        fd.append('file', file);
        fd.append('mode', 'merge');        // 기존 우선. 덮어쓰기는 기본이 아니다
        const r = await fetch(`${API}/import`, { method: 'POST', body: fd });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) {
          portableStatus(d.message || `가져오지 못했어요 (HTTP ${r.status})`, true);
          return;
        }
        portableStatus(d.message || '가져왔어요.');
      } catch (e) {
        console.error('[portable] 가져오기 실패', e);
        portableStatus('가져오지 못했어요. 서버가 켜져 있는지 확인해 주세요.', true);
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    // ── API 설정 확인 ──────────────────────────────────────────────
    async function checkApiConfig() {
      try {
        const res = await fetch(`${API}/api/config`);
        const data = await res.json();
        hasExistingKey = data.has_key;
        selectedProvider = data.provider || 'gemini';
        updateProviderTabs();
        applyWakeConfig(data);
        if (!data.has_key) {
          // 키 없음 → 설정창 자동 오픈
          activate(false);
          setTimeout(() => _showSettingsNow(true), 300);
        }
      } catch (e) {
        console.error('[config check]', e);
      }
    }

    // ── 설정창 ─────────────────────────────────────────────────────
    function selectProvider(p) {
      selectedProvider = p;
      updateProviderTabs();
    }

    function updateProviderTabs() {
      ['gemini', 'claude', 'openai'].forEach(p => {
        const el = document.getElementById('ptab-' + p);
        if (el) el.className = 'ptab' + (p === selectedProvider ? ' active' : '');
      });
      const link = document.getElementById('s-link');
      if (link) link.href = PROVIDER_LINKS[selectedProvider] || '#';
    }

    function showSettings() {
      if (!isActive) {
        activate(false);
        setTimeout(() => _showSettingsNow(false), 280);
      } else {
        _showSettingsNow(false);
      }
    }

    function _showSettingsNow(isFirst) {
      updateProviderTabs();
      document.getElementById('s-status').textContent = '';
      document.getElementById('s-status').className = 's-status';
      document.getElementById('api-key-input').value = '';
      // 취소 버튼: 이미 키가 있을 때만 표시
      document.getElementById('s-cancel-btn').style.display = hasExistingKey ? 'block' : 'none';
      document.getElementById('s-close-btn').style.display = hasExistingKey ? 'flex' : 'none';
      // 웨이크워드는 `.env`나 다른 창에서 바뀌었을 수 있으니 열 때마다 다시 읽는다.
      // (실패해도 설정창은 떠야 한다 — API 키를 넣으러 온 사람을 막지 않는다)
      loadWakeConfig();
      document.getElementById('settings-overlay').classList.add('show');
      setTimeout(() => document.getElementById('api-key-input').focus(), 100);
    }

    function hideSettings() {
      if (!hasExistingKey) return; // 키 없으면 닫기 불가
      document.getElementById('settings-overlay').classList.remove('show');
      document.getElementById('api-key-input').value = '';
    }

    async function saveConfig() {
      const key = document.getElementById('api-key-input').value.trim();
      if (!key) { setSettingStatus('API Key를 입력하세요', 'err'); return; }

      const saveBtn = document.getElementById('s-save-btn');
      saveBtn.disabled = true;
      saveBtn.textContent = '저장 중...';
      setSettingStatus('', '');

      try {
        const res = await fetch(`${API}/api/config`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ provider: selectedProvider, api_key: key }),
        });
        const data = await res.json();
        if (data.status === 'ok') {
          hasExistingKey = true;
          setSettingStatus('✓ 저장 완료!', 'ok');
          setTimeout(() => {
            document.getElementById('settings-overlay').classList.remove('show');
            document.getElementById('api-key-input').value = '';
            // WS 재연결 → 새 에이전트 사용
            if (ws) { ws.close(); }
          }, 1000);
        } else {
          setSettingStatus('저장 실패: ' + JSON.stringify(data), 'err');
        }
      } catch (e) {
        setSettingStatus('오류: ' + e.message, 'err');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = '저장하고 시작';
      }
    }

    // ── 웨이크워드 (BL-13) ────────────────────────────────────────
    //
    // 서버 API는 2026-09-02부터 열려 있었는데 입력란이 없어서 사용자가 `.env`를
    // 직접 열어야 했다. 여기가 그 입력란이다.
    //
    // ⚠️ 웨이크워드 프로세스는 Electron이 띄운 **별도 프로세스**라 서버가 직접
    //   못 바꾼다. `.env`를 다시 읽어 **10초 안에** 반영되므로 그 사실을 말해 준다 —
    //   저장 직후 "플루이즈"라고 불러 보고 안 되면 고장으로 오해하기 때문이다.
    let wakeWordsDefault = '플루이즈';

    function applyWakeConfig(data) {
      if (!data) return;
      wakeWordsDefault = data.wake_words_default || wakeWordsDefault;
      const input = document.getElementById('wake-words-input');
      const toggle = document.getElementById('wake-enabled');
      if (input) {
        input.value = data.wake_words || '';
        input.placeholder = wakeWordsDefault;   // 비워 두면 이게 쓰인다
      }
      if (toggle) toggle.checked = data.wake_word_enabled !== false;
    }

    async function loadWakeConfig() {
      setWakeStatus('', '');
      try {
        const res = await fetch(`${API}/api/config`);
        applyWakeConfig(await res.json());
      } catch (e) {
        console.error('[wakeword] 설정 읽기 실패', e);
      }
    }

    async function saveWakeWords() {
      const btn = document.getElementById('wake-save-btn');
      const words = document.getElementById('wake-words-input').value.trim();
      const enabled = document.getElementById('wake-enabled').checked;

      btn.disabled = true;
      btn.textContent = '저장 중';
      setWakeStatus('', '');
      try {
        const res = await fetch(`${API}/api/wakeword`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ wake_words: words, enabled }),
        });
        const data = await res.json();
        if (data.status === 'ok') {
          // 서버가 정리한 값(공백 제거 등)을 그대로 되돌려 받아 다시 채운다.
          document.getElementById('wake-words-input').value = data.wake_words || '';
          if (!enabled) {
            setWakeStatus('✓ 껐어요. Alt+Space로 부를 수 있어요', 'ok');
          } else {
            const shown = data.wake_words || wakeWordsDefault;
            setWakeStatus(`✓ "${shown}" 저장 — 10초 안에 반영돼요`, 'ok');
          }
        } else {
          setWakeStatus('저장 실패: ' + JSON.stringify(data), 'err');
        }
      } catch (e) {
        setWakeStatus('오류: ' + e.message, 'err');
      } finally {
        btn.disabled = false;
        btn.textContent = '저장';
      }
    }

    function setWakeStatus(msg, cls) {
      const el = document.getElementById('wake-status');
      if (!el) return;
      el.textContent = msg;
      el.className = 's-status' + (cls ? ' ' + cls : '');
    }

    function setSettingStatus(msg, cls) {
      const el = document.getElementById('s-status');
      el.textContent = msg;
      el.className = 's-status' + (cls ? ' ' + cls : '');
    }

    // ── 활성화 / 비활성화 ──────────────────────────────────────────
    function activate(autoMic = false) {
      if (isActive) {
        if (autoMic && !isRec && !busy) setTimeout(() => startMic(), 150);
        return;
      }
      isActive = true;
      document.getElementById('card').classList.add('active');
      window.pluiz.resizeActive();
      setState('ready');
      if (autoMic) setTimeout(() => startMic(), 300);
      else setTimeout(() => document.getElementById('txt').focus(), 200);
    }

    function deactivate() {
      stopVad();
      hideLevel();
      if (isRec) stopMic(false);
      if (historyOpen) hideHistory();
      if (favOpen) hideFavorites();
      isActive = false; busy = false; streamEl = null;
      document.getElementById('card').classList.remove('active');
      document.getElementById('settings-overlay').classList.remove('show');
      window.pluiz.resizeIdle();
      setWf('');
    }

    // ── 상태 ──────────────────────────────────────────────────────
    function setState(s) {
      const el = document.getElementById('slbl');
      const L = { ready: '말씀하세요...', recording: '🔴 듣는 중...', processing: '⏳ 처리 중...' };
      el.textContent = L[s] || '';
      el.className = 'state-lbl' + ({ recording: ' rec', processing: ' proc' }[s] || '');
    }
    function setWf(m) { document.getElementById('wf').className = 'waveform' + (m ? ' wf-' + m : ''); }
    function setBusy(v) { busy = v; document.getElementById('send-btn').disabled = v; }
    function showTyping(v) { document.getElementById('typing').className = 'typing' + (v ? ' show' : ''); }
    function scrollChat() { const c = document.getElementById('chat'); c.scrollTop = c.scrollHeight; }

    // ── 입력 레벨 링 ───────────────────────────────────────────────
    function showLevel() {
      const ring = document.getElementById('cdring');
      ring.classList.add('show', 'idle');
      document.getElementById('cdprog').style.strokeDashoffset = String(CIRCUM);
    }
    function setLevel(rms, live) {
      const prog = document.getElementById('cdprog');
      if (!prog) return;
      // 0.12 RMS를 «가득»으로 본다. 말소리는 대개 그 아래에서 논다.
      const f = Math.max(0, Math.min(1, rms / 0.12));
      prog.style.strokeDashoffset = String(CIRCUM * (1 - f));
      document.getElementById('cdring').classList.toggle('idle', !live);
    }
    function hideLevel() {
      document.getElementById('cdring').classList.remove('show');
    }

    // ── 발화 종료 감지 (BL-33) ─────────────────────────────────────
    // 서버는 손대지 않는다 — 렌더러 안에서 끝나는 변경이다.
    function startVad(stream) {
      stopVad();
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) {
        // 폴백: 분석기가 없으면 상한만으로 끊는다. 예전(8초)보다 낫다.
        vadMaxTimer = setTimeout(() => stopMic(true), VAD.MAX_MS);
        return;
      }
      let an, buf;
      try {
        vadCtx = new Ctx();
        const src = vadCtx.createMediaStreamSource(stream);
        an = vadCtx.createAnalyser();
        an.fftSize = 1024;
        src.connect(an);                     // ⚠️ destination에 잇지 않는다 —
        buf = new Float32Array(an.fftSize);  //    이으면 자기 목소리가 스피커로 나간다
      } catch (e) {
        console.error('[VAD] 분석기 실패, 상한만 씁니다', e);
        vadMaxTimer = setTimeout(() => stopMic(true), VAD.MAX_MS);
        return;
      }

      const t0 = Date.now();
      let speechAt = 0, quietAt = 0, floorSum = 0, floorN = 0, startRms = 0;
      vadPeak = 0;

      // ⚠️ 인터벌과 별개로 상한을 하나 더 건다. 인터벌이 throttle돼도 끊긴다.
      vadMaxTimer = setTimeout(() => endVad('max'), VAD.MAX_MS);

      vadTimer = setInterval(() => {
        an.getFloatTimeDomainData(buf);
        let sum = 0;
        for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
        const rms = Math.sqrt(sum / buf.length);
        if (rms > vadPeak) vadPeak = rms;
        const now = Date.now(), age = now - t0;
        setLevel(rms, !!speechAt);

        if (!speechAt) {
          if (age < VAD.FLOOR_MS) { floorSum += rms; floorN++; return; }
          if (!startRms) {
            const floor = floorN ? floorSum / floorN : 0;
            startRms = Math.min(VAD.FLOOR_MAX,
                                Math.max(VAD.START_RMS, floor * VAD.FLOOR_MULT));
            console.log('[VAD] 잡음 바닥', floor.toFixed(4), 'ㅡ> 시작임계', startRms.toFixed(4));
          }
          if (rms >= startRms) { speechAt = now; quietAt = 0; setState('recording'); }
          else if (age >= (recAuto ? VAD.NOSPEECH_AUTO_MS : VAD.NOSPEECH_MS))
            endVad('nospeech');
          return;
        }

        if (rms >= VAD.KEEP_RMS) quietAt = 0;
        else if (!quietAt) quietAt = now;
        if (quietAt && now - quietAt >= VAD.SILENCE_MS) endVad('endpoint');
      }, VAD.TICK_MS);
    }

    function endVad(reason) {
      console.log('[VAD] 종료 사유=' + reason + ' 최대RMS=' + vadPeak.toFixed(4));
      stopVad();
      if (reason === 'nospeech') {
        // 말이 한 번도 없었다 → STT를 부르지 않는다(빈 요청을 막는다)
        const auto = recAuto;
        stopMic(false);
        if (auto) { closeIfSpurious(); return; }   // 헛깨어남 — 말없이 닫는다
        const el = document.getElementById('slbl');
        if (el) { el.textContent = '말이 없어서 그만 들었어요'; el.className = 'state-lbl'; }
        setTimeout(() => { if (!isRec && !busy) setState('ready'); }, 1800);
        return;
      }
      stopMic(true);
    }

    function closeIfSpurious() {
      // 웨이크워드가 **열었고** 대화가 하나도 안 생겼으면 없던 일로 한다.
      // ⚠️ busy면 손대지 않는다 — 서버가 답하는 중이면 그건 진짜 턴이다.
      if (!recAuto || !wakeOpened || busy) return;
      recAuto = false; wakeOpened = false;
      deactivate();
    }

    function stopVad() {
      clearInterval(vadTimer); vadTimer = null;
      clearTimeout(vadMaxTimer); vadMaxTimer = null;
      if (vadCtx) { try { vadCtx.close(); } catch (e) {} vadCtx = null; }
    }

    // ── 음성 녹음 ─────────────────────────────────────────────────
    function toggleMic() {
      if (busy) return;
      micAuto = false; wakeOpened = false;   // 사람이 눌렀다 — 오류를 숨기지 않는다
      if (isRec) stopMic(true);
      else startMic();
    }

    // 🚨 2026-09-09 — `isRec = true`가 **await 뒤에** 있어서 경쟁 조건이 있었다.
    //   getUserMedia가 끝나기 전에는 isRec가 false라, 그 사이에 startMic()이 또
    //   불리면 **가드를 통과해 레코더가 둘** 생긴다. 전역 `mr`은 두 번째로
    //   덮어써지고, **참조를 잃은 첫 번째가 같은 chunks 배열에 계속 쓴다** →
    //   webm 스트림 두 개가 섞인 블롭 → 디코딩 실패 → STT가 빈 결과를 낸다.
    //
    //   실기(2026-09-09 17:13~17:15): 첫 녹음 74KB만 성공하고 그 뒤 6번이 전부
    //   ~130KB 균일한 크기로 실패했다. 웨이크워드가 5초 간격으로 두 번 뜬 것
    //   (17:14:36 · 17:14:41 → activate(true) 두 번)이 방아쇠였다.
    //
    // ⚠️ `micStarting`을 **동기로** 세우는 것이 핵심이다. await 뒤에 세우는 값은
    //    가드가 될 수 없다.
    let micStarting = false;

    async function startMic() {
      if (isRec || micStarting) return;
      micStarting = true;                 // ★ await **전에** 동기로 잠근다
      stopCurrentAudio(); // 마이크 시작 시 TTS 중단
      let stream = null;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        // 기다리는 동안 중단됐거나 다른 녹음이 시작됐으면 **이 스트림은 버린다.**
        if (isRec) { stream.getTracks().forEach(t => t.stop()); return; }
        // 혹시 남아 있는 이전 레코더가 있으면 확실히 끊는다(고아 방지)
        if (mr && mr.state !== 'inactive') {
          try { mr.ondataavailable = null; mr.onstop = null; mr.stop(); } catch (e) {}
        }
        const rec = new MediaRecorder(stream, { mimeType: 'audio/webm' });
        mr = rec;
        chunks = [];
        // ⚠️ `mr`이 아니라 **자기 자신(rec)** 을 본다. 전역이 바뀌어도
        //    남의 chunks에 쓰지 않는다.
        rec.ondataavailable = e => {
          if (mr === rec && !micDiscard && e.data.size > 0) chunks.push(e.data);
        };
        rec.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          if (mr !== rec) return;         // 이미 다른 녹음으로 넘어갔으면 버린다
          if (micDiscard) { chunks = []; return; }   // 버리기로 한 녹음이다
          const parts = chunks; chunks = [];
          if (parts.length > 0) await sendVoice(new Blob(parts, { type: 'audio/webm' }));
        };
        rec.start(100);
        isRec = true;
        micDiscard = false;             // 새 녹음은 버리지 않는다(이전 값이 남지 않게)
        recAuto = micAuto; micAuto = false;   // 출처를 **이 녹음에** 고정한다
        setState('ready'); setWf('rec');   // 말이 잡히기 전까진 '말씀하세요...'
        document.getElementById('mic-btn').classList.add('rec');
        document.getElementById('mic-btn').textContent = '⏹️';
        showLevel();
        startVad(stream);
      } catch (err) {
        if (stream) stream.getTracks().forEach(t => t.stop());
        addMsg('a', '⚠️ 마이크 접근 실패: ' + err.message);
      } finally {
        micStarting = false;
      }
    }

    function stopMic(send = true) {
      stopVad();
      hideLevel();
      // ★ `mr.stop()`의 마지막 flush까지 막으려면 **플래그가 먼저** 서야 한다.
      //   배열을 비우는 것만으로는 못 막는다(위 micDiscard 주석).
      micDiscard = !send;
      if (!send) chunks = [];
      // ⚠️ `isRec`만 보지 않는다 — 레코더가 살아 있는데 플래그만 내려가면
      //    고아가 되어 다음 녹음의 chunks를 오염시킨다(위 주석의 그 사고다).
      if (mr && mr.state !== 'inactive') { try { mr.stop(); } catch (e) {} }
      isRec = false;
      document.getElementById('mic-btn').classList.remove('rec');
      document.getElementById('mic-btn').textContent = '🎙️';
      setWf('');
      flushPendingAudio();   // 녹음 때문에 미뤄 둔 TTS가 있으면 지금 내보낸다
    }

    async function sendVoice(blob) {
      if (!blob || blob.size < 500) { setState('ready'); return; }
      setBusy(true); setState('processing'); setWf('proc');
      try {
        const fd = new FormData();
        fd.append('audio', blob, 'voice.webm');
        fd.append('thread_id', threadId);
        fd.append('use_tts', 'true');
        const res = await fetch(`${API}/voice`, { method: 'POST', body: fd });
        const data = await res.json();
        if (data.error) {
          // 🚨 웨이크워드가 연 녹음이면 **말없이 닫는다.** 사용자가 시킨 적 없는
          //    턴의 오류를 보여 주면, 헛깨어남이 «고장»처럼 보인다(BL-23 완화).
          if (recAuto) { closeIfSpurious(); }
          else { addMsg('a', '⚠️ ' + data.error); }
        } else {
          if (data.text) addMsg('u', '🎤 ' + data.text);
          addMsg('a', data.response);
          if (data.audio_base64) playAudio(data.audio_base64);
        }
      } catch (err) {
        addMsg('a', '⚠️ ' + err.message);
      } finally {
        setBusy(false); setState('ready'); setWf('');
      }
    }

    // ── 텍스트 전송 (TTS 활성화) ──────────────────────────────────
    function sendText() {
      const el = document.getElementById('txt');
      const text = el.value.trim();
      if (!text || busy) return;
      if (!ws || ws.readyState !== WebSocket.OPEN) { addMsg('a', '⚠️ 서버 연결 없음'); return; }
      addMsg('u', text);
      el.value = ''; el.style.height = 'auto';
      setBusy(true); showTyping(true); setState('processing');
      ws.send(JSON.stringify({ text, thread_id: threadId, use_tts: true }));
    }
    function onKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); } }
    function resizeTxt(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 60) + 'px'; }

    // ── 채팅 ──────────────────────────────────────────────────────
    function addMsg(role, text) {
      const chat = document.getElementById('chat');
      const typing = document.getElementById('typing');
      const el = document.createElement('div');
      el.className = 'msg ' + role;
      el.innerHTML = `<div class="av ${role}">${role === 'u' ? '👤' : '🤖'}</div><div class="bbl">${esc(text)}</div>`;
      chat.insertBefore(el, typing);
      scrollChat();
      return el;
    }
    function esc(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
    }

    // ── TTS 재생 ──────────────────────────────────────────────────
    let currentAudio = null;
    let pendingAudio = null;

    function stopCurrentAudio() {
      pendingAudio = null;   // 새 녹음이 시작되면 밀어 둔 TTS는 버린다(낡았다)
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.src = '';
        currentAudio = null;
      }
    }

    function flushPendingAudio() {
      if (!pendingAudio) return;
      const b64 = pendingAudio; pendingAudio = null;
      setTimeout(() => playAudio(b64), 200);
    }

    function playAudio(b64) {
      // 🚨 BL-33 — 녹음 중에 TTS를 틀면 자기 목소리가 마이크로 되먹임돼
      //    «무음이 오지 않는» 끝나지 않는 녹음이 된다. 화면 감시 알림
      //    (onWatchNotify)은 아무 때나 들어오므로 여기서 막는다.
      //    ⚠️ 알림을 삼키지는 않는다 — 글은 이미 채팅에 나갔고, 소리는
      //    녹음이 끝나는 즉시 흘려보낸다(flushPendingAudio).
      if (isRec) { pendingAudio = b64; return; }
      try {
        stopCurrentAudio(); // 기존 TTS 중단 후 새 TTS 재생
        const raw = atob(b64);
        const arr = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
        const url = URL.createObjectURL(new Blob([arr], { type: 'audio/mpeg' }));
        const a = new Audio(url);
        a.volume = 1.0;
        a.play().catch(e => console.error('[TTS]', e));
        a.onended = () => { URL.revokeObjectURL(url); currentAudio = null; };
        currentAudio = a;
      } catch (e) { console.error('[TTS] error', e); }
    }

    // ── 화면 감시 알림 ────────────────────────────────────────────
    // 감시는 사용자가 화면을 안 보고 있을 때 쓰는 기능이다. 그래서 조용히
    // 채팅에만 적으면 전달되지 않는다 — 창을 앞으로 꺼내고 소리로도 알린다.
    function onWatchNotify(m) {
      setWatchBadge(false);
      window.pluiz.showWindow();
      activate(false);
      addMsg('a', m.text || '');
      if (m.audio_base64) playAudio(m.audio_base64);
    }

    function setWatchBadge(active) {
      const el = document.getElementById('watch-badge');
      if (el) el.className = 'watch-badge' + (active ? ' show' : '');
    }

    // ── IPC ───────────────────────────────────────────────────────
    window.pluiz.onWakeDetected(() => {
      const ring = document.getElementById('logo-ring');
      ring.classList.remove('listening');
      ring.classList.add('awake');
      ring.addEventListener('animationend', () => {
        ring.classList.remove('awake');
        if (!isActive) ring.classList.add('listening');
      }, { once: true });
      // 이 녹음은 **사람이 시킨 것이 아니다.** 실패하면 조용히 닫는다.
      micAuto = true;
      wakeOpened = !isActive;    // 이미 떠 있었으면 닫지 않는다
      activate(true);
    });

    // BUG-08: ready/loading 상태를 UI에 실제로 반영
    window.pluiz.onWakewordStatus(s => {
      document.getElementById('idle-hint').textContent =
        s === 'ready' ? '더블클릭 · 🎙️' : '웨이크워드 로딩 중...';
    });

    window.pluiz.onToggleActive(() => {
      micAuto = false; wakeOpened = false;   // Alt+Space는 **사람**이다
      if (isActive) deactivate();
      else activate(true);
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && isActive) deactivate();
    });

    connect();
  </script>
