<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <title>Pluiz Mini</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+KR:wght@400;600&display=swap');

    :root {
      --bg:      rgba(12, 12, 20, 0.92);
      --border:  rgba(124, 106, 255, 0.25);
      --accent:  #7c6aff;
      --accent2: #a78bfa;
      --red:     #ff4d6d;
      --green:   #34d399;
      --text:    #e2e2f0;
      --muted:   #6b6b8a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 280px;
      height: 80px;
      overflow: hidden;
      background: transparent;
      font-family: 'Noto Sans KR', sans-serif;
      -webkit-app-region: no-drag;
      user-select: none;
    }

    #mini {
      width: 280px;
      height: 80px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      cursor: grab;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(124,106,255,0.1);
      transition: box-shadow 0.2s, border-color 0.3s;
      position: relative;
    }
    #mini:hover {
      box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(124,106,255,0.3);
      border-color: rgba(124,106,255,0.4);
    }
    #mini.active {
      border-color: rgba(124,106,255,0.7);
      box-shadow: 0 0 20px rgba(124,106,255,0.3), 0 8px 32px rgba(0,0,0,0.4);
    }
    #mini.listening {
      border-color: rgba(255,77,109,0.7);
      box-shadow: 0 0 20px rgba(255,77,109,0.3), 0 8px 32px rgba(0,0,0,0.4);
    }
    #mini:active { cursor: grabbing; }

    /* ── 마이크 버튼 ── */
    #micArea {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(124,106,255,0.15);
      border: 1.5px solid rgba(124,106,255,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.3s, border-color 0.3s, transform 0.2s;
      position: relative;
      -webkit-app-region: no-drag;
    }
    #micArea:hover { background: rgba(124,106,255,0.25); transform: scale(1.05); }

    #micArea::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      opacity: 0;
      transition: opacity 0.3s;
    }
    #micArea.listening::before {
      opacity: 1;
      animation: ripple 1.5s ease-in-out infinite;
    }
    @keyframes ripple {
      0%   { transform: scale(1);   opacity: 0.8; }
      100% { transform: scale(1.5); opacity: 0; }
    }
    #micArea.listening {
      background: rgba(255,77,109,0.2);
      border-color: var(--red);
    }
    #micArea.processing {
      background: rgba(124,106,255,0.3);
      border-color: var(--accent);
      animation: micPulse 0.8s ease infinite;
    }
    @keyframes micPulse {
      0%,100% { transform: scale(1); }
      50%     { transform: scale(1.08); }
    }

    /* ── 텍스트 영역 ── */
    #textArea {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    #stateLabel {
      font-size: 11px;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      letter-spacing: 0.3px;
      transition: color 0.3s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #stateLabel.active-text { color: var(--accent2); }
    #stateLabel.listen-text { color: var(--red); }

    #lastText {
      font-size: 12px;
      color: var(--text);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── 파형 ── */
    #waveform {
      display: none;
      gap: 2px;
      align-items: center;
      height: 16px;
    }
    #waveform.show { display: flex; }
    #waveform span {
      display: block; width: 3px;
      background: var(--red);
      border-radius: 2px;
      animation: waveBar 0.8s ease-in-out infinite;
    }
    #waveform span:nth-child(1){height:6px; animation-delay:0s}
    #waveform span:nth-child(2){height:14px;animation-delay:.1s}
    #waveform span:nth-child(3){height:9px; animation-delay:.2s}
    #waveform span:nth-child(4){height:16px;animation-delay:.3s}
    #waveform span:nth-child(5){height:7px; animation-delay:.4s}
    @keyframes waveBar {
      0%,100% { transform: scaleY(1); }
      50%     { transform: scaleY(1.6); }
    }

    /* ── 상태 도트 ── */
    #dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      flex-shrink: 0;
      transition: background 0.3s;
    }
    #dot.busy { background: var(--accent2); animation: blink 0.8s infinite; }
    #dot.rec  { background: var(--red);    animation: blink 0.5s infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* ── 닫기 버튼 ── */
    #closeBtn {
      position: absolute;
      top: 6px; right: 10px;
      width: 18px; height: 18px;
      background: rgba(255,255,255,0.07);
      border: none;
      border-radius: 50%;
      color: var(--muted);
      font-size: 9px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
      transition: opacity 0.2s, background 0.2s;
      -webkit-app-region: no-drag;
    }
    #mini:hover #closeBtn { opacity: 1; }
    #closeBtn:hover { background: rgba(255,77,109,0.3); color: var(--red); }

    #hint {
      position: absolute;
      bottom: 5px; right: 12px;
      font-size: 9px;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      opacity: 0;
      transition: opacity 0.2s;
    }
    #mini:hover #hint { opacity: 0.5; }
  </style>
</head>
<body>

<div id="mini">
  <div id="micArea" title="클릭해서 음성 명령">🎤</div>

  <div id="textArea">
    <span id="stateLabel">클릭하거나 더블클릭해 전체화면</span>
    <div id="waveform">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <span id="lastText"></span>
  </div>

  <div id="dot"></div>
  <button id="closeBtn" title="종료">✕</button>
  <span id="hint">더블클릭 시 전체화면</span>
</div>

<script>
  const mini       = document.getElementById('mini');
  const micArea    = document.getElementById('micArea');
  const stateLabel = document.getElementById('stateLabel');
  const waveform   = document.getElementById('waveform');
  const lastText   = document.getElementById('lastText');
  const dot        = document.getElementById('dot');
  const closeBtn   = document.getElementById('closeBtn');

  const API = 'http://localhost:8000';

  // ── Web Speech API 설정 ───────────────────────────────
  let isListening = false;

  function setMiniState(s) {
    // idle | listening | processing | done
    micArea.className = s !== 'idle' ? s : '';
    dot.className     = s === 'listening' ? 'rec' : s === 'processing' ? 'busy' : '';
    mini.className    = s !== 'idle' ? (s === 'listening' ? 'listening' : 'active') : '';
    waveform.className = s === 'listening' ? 'show' : '';

    const labels = {
      idle:       '대기중-"Pluiz를 불러보세요."',
      listening:  '말씀하세요...',
      processing: '처리 중...',
    };
    stateLabel.textContent = labels[s] || '';
    stateLabel.className   = s === 'listening' ? 'listen-text' : s !== 'idle' ? 'active-text' : '';
    micArea.textContent    = s === 'listening' ? '⏹' : s === 'processing' ? '⏳' : '🎤';
  }

  async function startVoice() {
    if (isListening) return;

    isListening = true;
    setMiniState('listening');

    try {
      // Python 서버가 직접 마이크를 잡아서 STT 수행
      const res  = await fetch(`${API}/api/stt/listen`, { method: 'POST' });
      const data = await res.json();

      if (data.status !== 'success' || !data.text) {
        lastText.textContent = '인식 실패';
        setMiniState('idle');
        return;
      }

      const text = data.text;
      lastText.textContent = text;
      setMiniState('processing');

      // 메인창으로 명령 전달 (IPC)
      if (window.electronAPI) {
        window.electronAPI.miniVoiceCommand(text);
      } else {
        fetch(`${API}/api/execute`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text }),
        }).then(() => setMiniState('idle'));
      }
    } catch (e) {
      console.error('[Mini STT]', e);
      lastText.textContent = '오류 발생';
      setMiniState('idle');
    } finally {
      isListening = false;
    }
  }

  // ── IPC: wake state 수신 ─────────────────────────────
  if (window.electronAPI) {
    window.electronAPI.onWakeState((state) => {
      const map = {
        idle:             'idle',
        wake_detected:    'processing',
        listening_command:'listening',
        processing:       'processing',
      };
      setMiniState(map[state] || 'idle');
    });
  }

  // ── 이벤트 ───────────────────────────────────────────

  // 마이크 버튼 클릭 → 음성 인식 시작/중지
  micArea.addEventListener('click', (e) => {
    e.stopPropagation();
    startVoice();
  });

  // 더블클릭 → 메인 창 열기
  mini.addEventListener('dblclick', () => {
    if (window.electronAPI) window.electronAPI.openMain();
  });

  // 닫기 버튼
  closeBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (window.electronAPI) window.electronAPI.quitApp();
  });

  // ── 드래그 이동 ──────────────────────────────────────
  let dragging = false, startX, startY;

  mini.addEventListener('mousedown', (e) => {
    if (e.target === closeBtn || e.target === micArea) return;
    dragging = true;
    startX = e.screenX;
    startY = e.screenY;
    document.addEventListener('mousemove', onDrag);
    document.addEventListener('mouseup',   onDragEnd);
  });

  function onDrag(e) {
    if (!dragging) return;
    const dx = e.screenX - startX;
    const dy = e.screenY - startY;
    startX = e.screenX;
    startY = e.screenY;
    if (window.electronAPI) window.electronAPI.moveMini(dx, dy);
  }

  function onDragEnd() {
    dragging = false;
    document.removeEventListener('mousemove', onDrag);
    document.removeEventListener('mouseup',   onDragEnd);
  }

  setMiniState('idle');
</script>
</body>
</html>
