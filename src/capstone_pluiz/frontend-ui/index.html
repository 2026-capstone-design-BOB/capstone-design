<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Pluiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 헤더 */
        .header {
            padding: 16px 24px;
            background: #16213e;
            border-bottom: 1px solid #0f3460;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 {
            font-size: 20px;
            color: #e94560;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
        }

        .status-text {
            font-size: 12px;
            color: #888;
        }

        /* 출력창 */
        .output-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.user {
            background: #0f3460;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.system {
            background: #16213e;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border-left: 3px solid #e94560;
        }

        .message.error {
            background: #2d1515;
            align-self: flex-start;
            border-left: 3px solid #f44336;
        }

        /* 로딩 */
        .loading {
            display: none;
            align-self: flex-start;
            padding: 12px 16px;
            background: #16213e;
            border-radius: 12px;
            border-left: 3px solid #e94560;
        }

        .loading.show {
            display: block;
        }

        .dots span {
            animation: blink 1.4s infinite;
            font-size: 20px;
            color: #e94560;
        }

        .dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {

            0%,
            80%,
            100% {
                opacity: 0;
            }

            40% {
                opacity: 1;
            }
        }

        /* 입력창 */
        .input-area {
            padding: 16px 20px;
            background: #16213e;
            border-top: 1px solid #0f3460;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            background: #1a1a2e;
            border: 1px solid #0f3460;
            border-radius: 24px;
            color: #e0e0e0;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-area input:focus {
            border-color: #e94560;
        }

        .input-area input::placeholder {
            color: #555;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-send {
            background: #e94560;
            color: white;
        }

        .btn-send:hover {
            background: #c73652;
        }

        .btn-send:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .btn-voice {
            background: #0f3460;
            color: #e0e0e0;
            font-size: 18px;
            padding: 12px 16px;
        }

        .btn-voice:hover {
            background: #1a4a80;
        }

        .btn-voice.recording {
            background: #e94560;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.7;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="status-dot" id="statusDot"></div>
        <h1>Pluiz</h1>
        <span class="status-text" id="statusText">서버 연결 확인 중...</span>
    </div>

    <div class="output-area" id="outputArea">
        <div class="message system">
            안녕하세요! Pluiz입니다. 무엇을 도와드릴까요?
        </div>
    </div>

    <div class="loading" id="loading">
        <div class="dots">
            <span>●</span><span>●</span><span>●</span>
        </div>
    </div>

    <div class="input-area">
        <button class="btn btn-voice" id="voiceBtn" title="음성 입력">🎤</button>
        <input type="text" id="commandInput" placeholder="명령을 입력하세요... (예: 메모장 열어줘)" />
        <button class="btn btn-send" id="sendBtn">전송</button>
    </div>

    <script>
        const SERVER_URL = 'http://localhost:8000'

        const outputArea = document.getElementById('outputArea')
        const commandInput = document.getElementById('commandInput')
        const sendBtn = document.getElementById('sendBtn')
        const voiceBtn = document.getElementById('voiceBtn')
        const loading = document.getElementById('loading')
        const statusDot = document.getElementById('statusDot')
        const statusText = document.getElementById('statusText')

        // 서버 상태 확인
        async function checkServer() {
            try {
                const res = await fetch(`${SERVER_URL}/`)
                if (res.ok) {
                    statusDot.style.background = '#4caf50'
                    statusText.textContent = '서버 연결됨'
                }
            } catch {
                statusDot.style.background = '#f44336'
                statusText.textContent = '서버 연결 안됨 (파이썬 서버를 먼저 실행하세요)'
            }
        }

        // 메시지 추가
        function addMessage(text, type = 'system') {
            const msg = document.createElement('div')
            msg.className = `message ${type}`
            msg.textContent = text
            outputArea.appendChild(msg)
            outputArea.scrollTop = outputArea.scrollHeight
        }

        // 명령 전송
        async function sendCommand(text) {
            if (!text.trim()) return

            addMessage(text, 'user')
            commandInput.value = ''
            sendBtn.disabled = true
            loading.classList.add('show')

            try {
                const res = await fetch(`${SERVER_URL}/api/execute`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                })
                const data = await res.json()

                if (data.status === 'success') {
                    const msg = data.result?.message || '명령을 실행했습니다.'
                    addMessage(msg, 'system')
                } else {
                    addMessage(`오류: ${data.message}`, 'error')
                }
            } catch {
                addMessage('서버에 연결할 수 없습니다. 파이썬 서버를 실행해주세요.', 'error')
            } finally {
                loading.classList.remove('show')
                sendBtn.disabled = false
                commandInput.focus()
            }
        }

        // 이벤트
        sendBtn.addEventListener('click', () => sendCommand(commandInput.value))
        commandInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') sendCommand(commandInput.value)
        })

        // 음성 입력 (Web Speech API)
        let recognition = null
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition
            recognition = new SR()
            recognition.lang = 'ko-KR'
            recognition.continuous = false
            recognition.interimResults = false

            recognition.onresult = e => {
                const text = e.results[0][0].transcript
                commandInput.value = text
                sendCommand(text)
            }
            recognition.onend = () => {
                voiceBtn.classList.remove('recording')
                voiceBtn.textContent = '🎤'
            }
        }

        voiceBtn.addEventListener('click', () => {
            if (!recognition) {
                addMessage('이 브라우저는 음성 인식을 지원하지 않습니다.', 'error')
                return
            }
            if (voiceBtn.classList.contains('recording')) {
                recognition.stop()
            } else {
                voiceBtn.classList.add('recording')
                voiceBtn.textContent = '⏹'
                recognition.start()
            }
        })

        // 초기화
        checkServer()
        setInterval(checkServer, 5000)
        commandInput.focus()
    </script>
</body>

</html>
