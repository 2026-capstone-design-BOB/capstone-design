<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pluiz V2</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;600&display=swap');

    :root {
      --bg:       #0a0a0f;
      --surface:  #12121a;
      --border:   #1e1e2e;
      --accent:   #7c6aff;
      --accent2:  #a78bfa;
      --red:      #ff4d6d;
      --text:     #e2e2f0;
      --muted:    #6b6b8a;
      --success:  #34d399;
      --radius:   12px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans KR', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-app-region: drag;
    }

    /* ── 타이틀바 ── */
    #titlebar {
      height: 38px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 8px;
      flex-shrink: 0;
      -webkit-app-region: drag;
    }
    #titlebar .dot { width: 10px; height: 10px; border-radius: 50%; }
    #titlebar .dot.red  { background: #ff5f57; }
    #titlebar .dot.yel  { background: #febc2e; }
    #titlebar .dot.grn  { background: #28c840; }
    #titlebar .title {
      margin-left: 8px;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* 우측 버튼 그룹을 묶어주기 위한 스타일 추가 */
    #titlebar .window-controls {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    
    /* 인라인 스타일로 길게 늘어져 있던 버튼 스타일들을 클래스로 깔끔하게 통합 */
    #titlebar .nav-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.2s;
      -webkit-app-region: no-drag;
    }
    #titlebar .nav-btn:hover {
      background: var(--border);
      color: var(--text);
    }

    /* ── 로그 영역 ── */
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-app-region: no-drag;
    }
    #log::-webkit-scrollbar { width: 4px; }
    #log::-webkit-scrollbar-track { background: transparent; }
    #log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .msg {
      max-width: 72%;
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.6;
      animation: fadeUp .25s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .msg.user {
      align-self: flex-end;
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.agent {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .msg.system {
      align-self: center;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      font-family: 'Space Mono', monospace;
    }

    /* ── 입력 영역 ── */
    #controls {
      padding: 16px 24px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      gap: 10px;
      align-items: center;
      flex-shrink: 0;
      -webkit-app-region: no-drag;
    }

    #textInput {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      color: var(--text);
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color .2s;
    }
    #textInput:focus { border-color: var(--accent); }
    #textInput::placeholder { color: var(--muted); }

    .btn {
      border: none;
      border-radius: var(--radius);
      padding: 12px 18px;
      cursor: pointer;
      font-size: 13px;
      font-family: 'Noto Sans KR', sans-serif;
      font-weight: 600;
      transition: opacity .15s, transform .1s;
      -webkit-app-region: no-drag;
    }
    .btn:hover { opacity: .85; }
    .btn:active { transform: scale(.97); }

    #sendBtn {
      background: var(--accent);
      color: #fff;
      min-width: 64px;
    }

    #micBtn {
      background: var(--border);
      color: var(--text);
      width: 46px;
      height: 46px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      position: relative;
      font-size: 18px;
    }
    #micBtn.recording {
      background: var(--red);
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255,77,109,.4); }
      50%       { box-shadow: 0 0 0 10px rgba(255,77,109,0); }
    }

    /* ── 상태 표시 ── */
    #statusBar {
      padding: 6px 24px;
      background: var(--bg);
      border-top: 1px solid var(--border);
      font-size: 11px;
      font-family: 'Space Mono', monospace;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    #statusDot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--success);
    }
    #statusDot.busy { background: var(--accent2); animation: blink .8s infinite; }
    #statusDot.error { background: var(--red); }
    @keyframes blink { 50% { opacity: 0; } }

    /* ── 음성 파형 미니 애니메이션 ── */
    .wave-icon {
      display: flex; gap: 2px; align-items: center; height: 16px;
    }
    .wave-icon span {
      display: block; width: 3px; background: currentColor; border-radius: 2px;
      animation: wave 1s ease-in-out infinite;
    }
    .wave-icon span:nth-child(1) { height: 6px;  animation-delay: 0s; }
    .wave-icon span:nth-child(2) { height: 12px; animation-delay: .15s; }
    .wave-icon span:nth-child(3) { height: 8px;  animation-delay: .3s; }
    .wave-icon span:nth-child(4) { height: 14px; animation-delay: .45s; }
    .wave-icon span:nth-child(5) { height: 6px;  animation-delay: .6s; }
    @keyframes wave {
      0%, 100% { transform: scaleY(1); }
      50%       { transform: scaleY(1.8); }
    }
  </style>
</head>
<body>

  <div id="titlebar">
    <div class="dot red"></div>
    <div class="dot yel"></div>
    <div class="dot grn"></div>
    <span class="title">Pluiz V2</span>
    
    <div class="window-controls">
      <button id="settingsToggle" class="nav-btn" title="설정">⚙️</button>
      <button onclick="window.close()" class="nav-btn" title="닫기">✕</button>
    </div>
  </div>

  <div id="log">
    <div class="msg system">Pluiz가 준비됐어요. 텍스트 또는 🎤 음성으로 명령하세요.</div>
  </div>

  <div id="controls">
    <button id="micBtn" title="음성 입력">🎤</button>
    <input id="textInput" type="text" placeholder="명령어를 입력하세요..." />
    <button id="sendBtn" class="btn">전송</button>
  </div>

  <div id="statusBar">
    <div id="statusDot"></div>
    <span id="statusText">ready</span>
  </div>

<script>
  const API = 'http://localhost:8000';

  // ── DOM ──────────────────────────────────────────────────
  const log        = document.getElementById('log');
  const textInput  = document.getElementById('textInput');
  const sendBtn    = document.getElementById('sendBtn');
  const micBtn     = document.getElementById('micBtn');
  const statusDot  = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');

  // ── 상태 ─────────────────────────────────────────────────
  let mediaRecorder = null;
  let audioChunks   = [];
  let isRecording   = false;
  let isBusy        = false;

  // ── 유틸 ─────────────────────────────────────────────────
  function setStatus(msg, state = 'ok') {
    statusText.textContent = msg;
    statusDot.className = state === 'busy' ? 'busy' : state === 'error' ? 'error' : '';
  }

  function addMessage(text, type) {
    const div = document.createElement('div');
    div.className = `msg ${type}`;
    div.textContent = text;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  function addWaveMessage() {
    const div = document.createElement('div');
    div.className = 'msg agent';
    div.innerHTML = '<div class="wave-icon"><span></span><span></span><span></span><span></span><span></span></div>';
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  function setInputEnabled(v) {
    isBusy = !v;
    textInput.disabled = !v;
    sendBtn.disabled   = !v;
    micBtn.disabled    = !v;
  }

  // ── 텍스트 전송 ───────────────────────────────────────────
  async function sendText(text) {
    if (!text.trim() || isBusy) return;
    textInput.value = '';
    addMessage(text, 'user');
    setInputEnabled(false);
    setStatus('명령 처리 중...', 'busy');

    const thinkingMsg = addWaveMessage();

    try {
      // 명령 실행
      const res  = await fetch(`${API}/api/execute`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      const data = await res.json();
      const reply = data.result ?? data.message ?? '완료됐습니다.';

      thinkingMsg.remove();
      addMessage(reply, 'agent');

      // TTS 재생
      await speakText(reply);
    } catch (e) {
      thinkingMsg.remove();
      addMessage('서버 연결 오류가 발생했습니다.', 'system');
      setStatus('error', 'error');
    } finally {
      setInputEnabled(true);
      setStatus('ready');
    }
  }

  // ── TTS 재생 ──────────────────────────────────────────────
  async function speakText(text) {
    try {
      setStatus('음성 출력 중...', 'busy');
      const res = await fetch(`${API}/api/tts`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      if (!res.ok) return;

      const blob = await res.blob();
      const url  = URL.createObjectURL(blob);
      const audio = new Audio(url);
      await new Promise((resolve) => {
        audio.onended = resolve;
        audio.onerror = resolve;
        audio.play();
      });
      URL.revokeObjectURL(url);
    } catch (e) {
      console.error('[TTS]', e);
    }
  }

  // ── 음성 녹음 ─────────────────────────────────────────────
  async function startRecording() {
    if (isBusy) return;
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioChunks  = [];
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) audioChunks.push(e.data);
      };

      mediaRecorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        const blob = new Blob(audioChunks, { type: 'audio/webm' });
        await handleVoiceInput(blob);
      };

      mediaRecorder.start();
      isRecording = true;
      micBtn.classList.add('recording');
      micBtn.textContent = '⏹';
      setStatus('녹음 중... (다시 누르면 전송)', 'busy');
    } catch (e) {
      addMessage('마이크 접근 권한이 필요합니다.', 'system');
      setStatus('마이크 오류', 'error');
    }
  }

  function stopRecording() {
    if (mediaRecorder && isRecording) {
      mediaRecorder.stop();
      isRecording = false;
      micBtn.classList.remove('recording');
      micBtn.textContent = '🎤';
      setStatus('음성 처리 중...', 'busy');
    }
  }

  async function handleVoiceInput(blob) {
    setInputEnabled(false);
    const thinkingMsg = addWaveMessage();

    try {
      // 1) STT
      const formData = new FormData();
      formData.append('audio', blob, 'audio.webm');

      const sttRes  = await fetch(`${API}/api/stt`, { method: 'POST', body: formData });
      const sttData = await sttRes.json();

      if (sttData.status !== 'success' || !sttData.text) {
        thinkingMsg.remove();
        addMessage('음성을 인식하지 못했습니다. 다시 시도해주세요.', 'system');
        return;
      }

      const userText = sttData.text;
      thinkingMsg.remove();
      addMessage(userText, 'user');          // 인식된 텍스트 표시

      // 2) 명령 실행
      setStatus('명령 처리 중...', 'busy');
      const thinkingMsg2 = addWaveMessage();

      const execRes  = await fetch(`${API}/api/execute`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: userText }),
      });
      const execData = await execRes.json();
      const reply    = execData.result ?? execData.message ?? '완료됐습니다.';

      thinkingMsg2.remove();
      addMessage(reply, 'agent');

      // 3) TTS
      await speakText(reply);

    } catch (e) {
      thinkingMsg.remove();
      addMessage('오류가 발생했습니다: ' + e.message, 'system');
      setStatus('error', 'error');
    } finally {
      setInputEnabled(true);
      setStatus('ready');
    }
  }

  // ── 이벤트 ───────────────────────────────────────────────
  micBtn.addEventListener('click', () => {
    isRecording ? stopRecording() : startRecording();
  });

  sendBtn.addEventListener('click', () => sendText(textInput.value));

  textInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendText(textInput.value);
    }
  });
</script>
</body>
</html>
